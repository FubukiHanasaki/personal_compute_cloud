name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          {
            POSTGRES_USER: pcc,
            POSTGRES_PASSWORD: ci-test-only,
            POSTGRES_DB: pcc,
          }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PCC_ENVIRONMENT: development
      PCC_SECRET: ci-only-not-a-production-secret-0123456789
      PCC_DATABASE_URL: postgresql+psycopg://pcc:ci-test-only@localhost/pcc
      PCC_TEST_DATABASE_URL: postgresql+psycopg://pcc:ci-test-only@localhost/pcc
      UV_PROJECT_ENVIRONMENT: tmp/venv
      UV_CACHE_DIR: tmp/uv-cache
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.13.0", enable-cache: false }
      - run: uv sync --extra test --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -W error::pytest.PytestUnhandledThreadExceptionWarning -W error::pytest.PytestUnraisableExceptionWarning
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python scripts/dev.py setup
      - run: npm run test:api --prefix web
      - run: npm run build --prefix web
      - run: npm install --prefix tmp/ui-browser --cache tmp/npm-cache --no-save playwright@1.64.1
      - run: node tmp/ui-browser/node_modules/playwright/cli.js install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: tmp/ui-browser/browsers
      - run: node tests/web-ui.mjs
        env:
          PLAYWRIGHT_BROWSERS_PATH: tmp/ui-browser/browsers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review
          path: |
            tmp/ui-qa/screenshots
            tmp/ui-qa/visual-report.json
          if-no-files-found: ignore

  agent-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.13.0", enable-cache: false }
      - run: uv sync --extra test --frozen
        env:
          UV_PROJECT_ENVIRONMENT: tmp/venv
          UV_CACHE_DIR: tmp/uv-cache
      - run: uv run --extra test pytest tests/test_agent_config.py tests/test_agent_gui.py tests/test_update_scripts.py tests/test_inference_adapters.py -W error::pytest.PytestUnhandledThreadExceptionWarning
        env:
          UV_PROJECT_ENVIRONMENT: tmp/venv
          UV_CACHE_DIR: tmp/uv-cache
          PYTHONDONTWRITEBYTECODE: 1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/update-windows.ps1 --help
      - if: runner.os != 'Windows'
        run: sh deploy/update-linux.sh --help && sh deploy/update-macos.sh --help
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./deploy/prepare-windows-worker.ps1
          $env:PCC_WINDOWS_RUNTIME = (Resolve-Path tmp/windows-worker-runtime).Path
          uv run --extra test pytest tests/test_windows_contract.py tests/test_windows_native.py tests/test_managed_process.py tests/test_windows_model_review.py tests/test_windows_startup_review.py tests/test_windows_models_native.py -q -W error::pytest.PytestUnhandledThreadExceptionWarning -W error::pytest.PytestUnraisableExceptionWarning
        env:
          UV_PROJECT_ENVIRONMENT: tmp/venv
          UV_CACHE_DIR: tmp/uv-cache
          PYTHONDONTWRITEBYTECODE: 1
