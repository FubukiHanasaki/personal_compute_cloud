[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-compute-cloud"
version = "0.1.0"
description = "Self-hosted capability-based personal compute cloud"
requires-python = ">=3.12,<3.15"
authors = [{name = "FubukiHanasaki"}]
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "psutil>=6,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
pcc-agent = "pcc_agent.cli:main"
pcc-server = "pcc_server.cli:main"

[tool.setuptools.packages.find]
where = ["server", "agent"]

[tool.pytest.ini_options]
pythonpath = ["server", "agent"]
testpaths = ["tests"]
addopts = "-ra --basetemp=tmp/pytest"
cache_dir = "tmp/pytest-cache"
